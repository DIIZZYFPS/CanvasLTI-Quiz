name: Rebuild Frontend Assets

# Flask serves the frontend straight out of the committed app/assets/
# directory (see app/utils/vite_manifest.py) rather than building it at
# deploy time, so the built bundle needs to stay in sync with Frontend/
# source changes on main. This rebuilds it and commits the result.
on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild and commit app/assets
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip rebuild]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build
        working-directory: Frontend
        run: npm run build

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/assets
          if git diff --cached --quiet; then
            echo "No changes to app/assets - build output is already up to date."
            exit 0
          fi
          git commit -m "chore: rebuild frontend assets [skip rebuild]" -m "Auto-generated by the Rebuild Frontend Assets workflow from $(git rev-parse --short HEAD)."
          git pull --rebase origin main
          git push origin HEAD:main
